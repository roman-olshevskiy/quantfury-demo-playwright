name: Main

on:
  push:
    branches: [main]

# Queue pushes to main instead of cancelling: every merged commit gets a full result.
concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static:
    uses: ./.github/workflows/static-checks.yml

  full-chromium:
    needs: static
    uses: ./.github/workflows/playwright.yml
    with:
      suite: full-chromium
      npm-script: test:full
      workers: 2
      timeout-minutes: 25

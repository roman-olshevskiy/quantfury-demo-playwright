name: Set up the test runner
description: Node.js from .nvmrc, dependencies via npm ci and, optionally, Playwright browsers.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install, or an empty string for none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node.js (version from .nvmrc)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Playwright browsers with OS dependencies
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      # Browsers match the pinned @playwright/test version from package-lock.json.
      run: npx playwright install --with-deps $BROWSERS
